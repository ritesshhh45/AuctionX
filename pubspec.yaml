name: auctionx
description: AuctionX cricket player auction (Flutter + Supabase)
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  excel: ^4.0.6
  pdf: ^3.11.1
  file_saver: ^0.2.14
  qr_flutter: ^4.1.0
  share_plus: ^10.1.0
  shared_preferences: ^2.3.0
  video_player: ^2.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#10111D"
    theme_color: "#DDB65B"
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/banner.jpg
    - assets/emblem.png
    - assets/intro.mp4
